<!-- The One Guadalupe Inn — Banner promocional 1280x270 (responsivo) -->
<!-- Imagen de stock (Unsplash) como placeholder: reemplazar por render/foto real. -->
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The One Guadalupe Inn — Banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

<style>
  :root {
    --navy-900: #0e1626;
    --navy-800: #1a2845;
    --navy-700: #24345a;
    --brand: #0580c3;
    --brand-light: #4daadf;
    --font-sans: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-serif: 'Playfair Display', Georgia, serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* Marco solo para previsualizar: centra el banner. Puedes quitarlo al integrar. */
  .stage {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: #eef2f7;
  }
  @media (prefers-color-scheme: dark) { .stage { background: #0b1220; } }

  /* ====== BANNER ====== */
  .banner {
    container-type: inline-size;
    position: relative;
    width: 100%;
    max-width: 1280px;
    aspect-ratio: 1280 / 270;
    border-radius: 14px;
    overflow: hidden;
    color: #fff;
    font-family: var(--font-sans);
    box-shadow: 0 24px 60px -30px rgba(10, 20, 40, 0.7);
    isolation: isolate;
  }

  /* Foto del edificio (derecha) + respaldo navy */
  .banner__photo {
    position: absolute; inset: 0; z-index: -3;
    background-color: var(--navy-800);
    background-image:
      url('https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?auto=format&fit=crop&w=1600&q=80'),
      linear-gradient(120deg, var(--navy-900), var(--navy-700));
    background-size: cover, cover;
    background-position: center right, center;
    background-repeat: no-repeat, no-repeat;
  }
  /* Velo navy en degradado: sólido a la izquierda, transparenta hacia la derecha */
  .banner__veil {
    position: absolute; inset: 0; z-index: -2;
    background:
      linear-gradient(100deg,
        var(--navy-900) 0%,
        var(--navy-800) 30%,
        rgba(26, 40, 69, 0.92) 42%,
        rgba(26, 40, 69, 0.6) 62%,
        rgba(26, 40, 69, 0.42) 100%);
  }
  /* Línea diagonal de acento en el corte */
  .banner__slash {
    position: absolute; top: -20%; left: 40%; z-index: -1;
    width: 2px; height: 140%;
    background: linear-gradient(to bottom, transparent, var(--brand-light), transparent);
    transform: rotate(12deg);
    transform-origin: top;
    opacity: 0.8;
  }

  .banner__inner {
    position: relative;
    height: 100%;
    display: flex;
    align-items: center;
    gap: 3cqw;
    padding: 0 4cqw;
  }

  /* ---- Columna de marca (izquierda) ---- */
  .brand-col { flex: 0 0 34%; }
  .brand-col .eyebrow {
    color: var(--brand-light);
    text-transform: uppercase;
    letter-spacing: 0.24em;
    font-weight: 600;
    font-size: 0.82cqw;
    margin-bottom: 1.4cqw;
  }
  .brand-name { line-height: 1; margin-bottom: 1.2cqw; }
  .brand-name .the-one {
    display: block;
    font-family: var(--font-serif);
    font-weight: 700;
    font-size: 4cqw;
    letter-spacing: 0.02em;
  }
  .brand-name .sub {
    display: block;
    font-weight: 600;
    font-size: 2.3cqw;
    letter-spacing: 0.22em;
    margin-top: 0.4cqw;
  }
  .brand-name .sub b { color: var(--brand-light); font-weight: 700; }
  .brand-rule { width: 3.4cqw; height: 2px; background: var(--brand-light); margin: 1.2cqw 0; }
  .brand-col p {
    font-size: 1.05cqw;
    line-height: 1.55;
    color: rgba(255, 255, 255, 0.82);
    max-width: 26cqw;
  }
  .brand-col p b { color: var(--brand-light); font-weight: 600; }

  /* ---- Fila de features + botones (derecha) ---- */
  .feature-row {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 2.6cqw;
  }
  .feat { text-align: center; width: 6.6cqw; }
  .feat svg { width: 2.1cqw; height: 2.1cqw; margin-bottom: 0.6cqw; }
  .feat span {
    display: block;
    font-size: 0.86cqw;
    font-weight: 500;
    line-height: 1.3;
    color: rgba(255, 255, 255, 0.92);
  }

  .banner__actions { display: flex; flex-direction: column; gap: 0.9cqw; margin-left: 1cqw; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.6cqw;
    font-family: var(--font-sans);
    font-weight: 600;
    font-size: 0.95cqw;
    padding: 0.95cqw 1.6cqw;
    border-radius: 0.7cqw;
    border: 1.5px solid transparent;
    white-space: nowrap;
    cursor: pointer;
    text-decoration: none;
    transition: transform 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
  }
  .btn svg { width: 1cqw; height: 1cqw; }
  .btn:hover { transform: translateY(-1px); }
  .btn--primary {
    background: linear-gradient(135deg, var(--brand-light), var(--brand));
    color: #fff;
    box-shadow: 0 6cqw 6cqw -4cqw rgba(5, 128, 205, 0.6);
  }
  .btn--ghost { border-color: rgba(255, 255, 255, 0.5); color: #fff; }
  .btn--ghost:hover { border-color: var(--brand-light); color: var(--brand-light); }

  /* ================= RESPONSIVE ================= */
  /* Tablet: reduce el número de columnas visuales manteniendo la fila */
  @container (max-width: 860px) {
    .brand-col { flex-basis: 40%; }
    .feature-row { gap: 1.8cqw; }
    .feat { width: 7.4cqw; }
  }

  /* Móvil: apila en vertical y deja crecer la altura */
  @media (max-width: 680px) {
    .banner {
      aspect-ratio: auto;
      border-radius: 12px;
    }
    .banner__veil {
      background: linear-gradient(180deg, rgba(26,40,69,0.86) 0%, rgba(14,22,38,0.95) 100%);
    }
    .banner__slash { display: none; }
    .banner__photo { background-position: center; }
    .banner__inner {
      flex-direction: column;
      align-items: flex-start;
      gap: 18px;
      padding: 26px 22px 30px;
    }
    .brand-col { flex: none; width: 100%; }
    .brand-col .eyebrow { font-size: 11px; margin-bottom: 12px; }
    .brand-name .the-one { font-size: 34px; }
    .brand-name .sub { font-size: 18px; }
    .brand-rule { width: 42px; margin: 12px 0; }
    .brand-col p { font-size: 14px; max-width: 100%; }

    .feature-row {
      width: 100%;
      flex-wrap: wrap;
      justify-content: flex-start;
      gap: 16px 10px;
    }
    .feat { width: calc(25% - 8px); }
    .feat svg { width: 24px; height: 24px; margin-bottom: 6px; }
    .feat span { font-size: 11px; }

    .banner__actions {
      flex-direction: row;
      width: 100%;
      margin-left: 0;
      gap: 10px;
    }
    .btn { flex: 1; font-size: 13px; padding: 12px 14px; border-radius: 10px; }
    .btn svg { width: 14px; height: 14px; }
    .btn--primary { box-shadow: 0 14px 24px -14px rgba(5, 128, 205, 0.6); }
  }

  @media (max-width: 420px) {
    .feat { width: calc(50% - 6px); }
    .banner__actions { flex-direction: column; }
  }
</style>

<div class="stage">
  <div class="banner" role="img" aria-label="The One Guadalupe Inn — Desarrollo inmobiliario moderno con acabados premium en CDMX">
    <div class="banner__photo"></div>
    <div class="banner__veil"></div>
    <div class="banner__slash"></div>

    <div class="banner__inner">
      <!-- Marca -->
      <div class="brand-col">
        <p class="eyebrow">Vive el lujo, en el corazón de la CDMX</p>
        <div class="brand-name">
          <span class="the-one">THE ONE</span>
          <span class="sub">GUADALUPE <b>INN</b></span>
        </div>
        <div class="brand-rule"></div>
        <p>Desarrollo inmobiliario moderno con <b>acabados premium</b> y excelente ubicación en CDMX.</p>
      </div>

      <!-- Features + acciones -->
      <div class="feature-row">
        <div class="feat">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-5h6v5"/><path d="M9 9h1M14 9h1M9 12h1M14 12h1"/></svg>
          <span>Diseño<br>exclusivo</span>
        </div>
        <div class="feat">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v-2a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2M3 12h18v5a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-5zM6 18v2M18 18v2"/></svg>
          <span>Amenidades<br>premium</span>
        </div>
        <div class="feat">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-5.5-7-11a7 7 0 0 1 14 0c0 5.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
          <span>Ubicación<br>estratégica</span>
        </div>
        <div class="feat">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12l3 6-9 12L3 9z"/><path d="M3 9h18M9 3l-1.5 6L12 21M15 3l1.5 6L12 21"/></svg>
          <span>Acabados<br>de lujo</span>
        </div>

        <div class="banner__actions">
          <a class="btn btn--primary" href="#amenidades">Ver amenidades
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </a>
          <a class="btn btn--ghost" href="#contacto">Solicitar información</a>
        </div>
      </div>
    </div>
  </div>
</div>
